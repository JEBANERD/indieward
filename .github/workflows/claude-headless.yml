name: claude-headless

# Works one card from docs/headless/QUEUE.md per run and opens a pull request for Jasper to review.
# Claude never pushes or merges: the steps after it push the branch and open the PR (or an issue if blocked).
on:
  schedule:
    - cron: "17 7 * * 1-5" # weekdays, about 3 am New York
  workflow_dispatch:
    inputs:
      card:
        description: "Card id from docs/headless/QUEUE.md (blank = next todo card)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-headless
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A personal token lets the PR trigger CI; GITHUB_TOKEN-made PRs don't start other workflows.
          token: ${{ secrets.IW_BOT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # 11 Nov: Ubuntu's mirror stopped resolving and this step hung for an hour. Retry, then give up fast.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg
      - run: python -m pip install -e ".[mcp,dev]"
      - name: Work branch
        run: |
          git config user.name "indieward-headless"
          git config user.email "headless@users.noreply.github.com"
          git checkout -b "headless/run-${{ github.run_id }}"
          mkdir -p .headless

      # A card stays `todo` on main until Jasper merges its PR, so without this the next run picks it again
      # (P2-23 got five identical PRs, #52-#56). RUNNER.md tells the worker to skip the cards listed here.
      - name: Cards already waiting in an open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --limit 100 --json title,headRefName \
            --jq '.[] | select(.headRefName | startswith("headless/")) | .title' \
            | grep -oE '^P[0-9]+-[0-9]+' | sort -u > .headless/OPEN_PRS.txt || true
          echo "Cards with an open headless PR:"; cat .headless/OPEN_PRS.txt

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the IndieWard headless worker. Read docs/headless/RUNNER.md and follow it exactly.
            Card to work: "${{ inputs.card }}" (blank means: the next eligible card in docs/headless/QUEUE.md).
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --disallowedTools "Bash(git push:*),Bash(gh pr merge:*),Bash(gh release:*)"

      # The action hides Claude's output; on failure print only the final error fields.
      - name: Show Claude error
        if: failure()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || { echo "No execution file at $f"; exit 0; }
          jq -c 'if type == "array" then . else [.] end
                 | (map(select(.type == "assistant")) | last | {error: .error, text: [.message.content[]?.text]}),
                   (map(select(.type == "result")) | last | {result, api_error_status, terminal_reason, errors})' "$f" || true

      - name: Open PR or issue
        env:
          GH_TOKEN: ${{ secrets.IW_BOT_TOKEN || github.token }}
        run: |
          # claude-code-action points origin at its own app token and revokes it when it finishes.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          ahead="$(git rev-list --count origin/main..HEAD)"
          # Title: TITLE.txt, else the last commit's subject (it starts with the card id), else a generic one.
          title="$(head -n1 .headless/TITLE.txt 2>/dev/null || true)"
          [ -n "$title" ] || { [ "$ahead" -gt 0 ] && title="$(git log -1 --format=%s)"; } || true
          [ -n "$title" ] || title="Headless run ${{ github.run_id }}"
          # A blocked run often commits the card's `blocked` row but writes no PR_BODY.md. Use BLOCKED.md as
          # the body then, so the PR still opens (11-16 Nov: P2-21 failed here four times and never left `todo`).
          body=.headless/PR_BODY.md
          [ -f "$body" ] || body=.headless/BLOCKED.md
          if [ -f .headless/BLOCKED.md ] && [ "$ahead" -eq 0 ]; then
            # Nothing to review, so the issue is the only hand-off.
            gh issue create --title "$title" --body-file .headless/BLOCKED.md --label headless || \
            gh issue create --title "$title" --body-file .headless/BLOCKED.md
          fi
          if [ "$ahead" -gt 0 ]; then
            [ -f "$body" ] || { printf 'Headless run %s left commits but no PR_BODY.md or BLOCKED.md.\n' "${{ github.run_id }}" > .headless/PR_BODY.md; body=.headless/PR_BODY.md; }
            git push -u origin HEAD
            gh pr create --base main --head "$(git branch --show-current)" --title "$title" --body-file "$body"
          else
            echo "No commits; nothing to open."
          fi
