name: live

# Weekly: are the outside services IndieWard relies on still working the way the code expects?
# FreeTSA, OpenTimestamps calendars, Steam store API, Roblox public APIs, one itch.io page.
on:
  schedule:
    - cron: "23 10 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]" opentimestamps-client
      - run: python -m pytest -q -m live tests/test_live.py
        env:
          INDIEWARD_LIVE: "1"
